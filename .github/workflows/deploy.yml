name: Forward GitHub Pages to Netlify

# The site left GitHub Pages for Netlify on 12 September 2026 (netlify.toml,
# and the README's Deployment section). This is what is left of the Pages
# deploy: a push to main publishes pages/, four files that forward each
# address the site used to have to the one it has now, query string and all.
# Nothing is built — the files are committed as they are served. Without
# this, the last real build would go on being served at
# ecao310.github.io/magnificent/ for as long as the repo exists.
#
# `the front door` in src/guards/meta.test.ts reads this file and pages/, and
# holds both to the README.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out the forwarders
        uses: actions/checkout@v4

      - name: Upload them as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
