<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- The favicon is drawn in the page's own two colours; `apple-touch-icon`
       is the same mark rasterised, because iOS will not take an SVG. Both
       hrefs go through %BASE_URL% rather than a bare `/`, which vite rewrites
       for the production build and the /preview/ one alike. -->
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <meta name="theme-color" content="#f7f3eb" />

  <!-- The two faces the page is set in: Newsreader for everything read and
       IBM Plex Mono for everything counted. Google Fonts is the one host the
       page asks anything of; the stacks in src/styles/index.css fall back to
       Georgia and Menlo until the faces arrive. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&amp;family=IBM+Plex+Mono:wght@300;400;500;600&amp;display=swap" />

  <title>Income Taxes in Early Retirement — Subsidy Slope</title>
  <!-- The search result: a different surface from the share card below. It
       ends on the list of sections it promises, and `the search snippet` in
       src/guards/meta.test.ts reads that list back out and looks for each one
       in a heading the page actually renders. -->
  <meta name="description"
    content="What a Roth conversion or a harvested gain really costs before 65, for your own household: the premium tax credit's slope, the 400% cliff and the floor.">

  <!-- What the link looks like when it is sent rather than opened. The card
       is deliberately not the reader's own household: this is static files
       on GitHub Pages, so no server sees the query string. It says what the
       page is, and the figures stay on the page. Absolute URLs, assembled
       from the origin plus %BASE_URL% so the preview build under /preview/
       points at its own copy rather than production's. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Subsidy Slope" />
  <meta property="og:title" content="How Much Can You Add This Year?" />
  <meta property="og:description"
    content="Before 65, every dollar you convert or harvest gives back a slice of your Marketplace credit — about 17 cents for a couple in the middle of the table, and all of it at 400% of the poverty line. Priced for your own household." />
  <meta property="og:url" content="https://ecao310.github.io%BASE_URL%" />
  <meta property="og:image" content="https://ecao310.github.io%BASE_URL%og-cover.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="A chart of the all-in rate on the next dollar of household income before 65: nothing under the Medicaid floor, a sawtooth climbing from 11% to 19% through the applicable-percentage table, a 10% plateau from 300% to 400% of the poverty line, and a cliff at 400%." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="How Much Can You Add This Year?" />
  <meta name="twitter:description"
    content="Before 65, every dollar you convert or harvest gives back a slice of your Marketplace credit — about 17 cents for a couple in the middle of the table, and all of it at 400% of the poverty line. Priced for your own household." />
  <meta name="twitter:image" content="https://ecao310.github.io%BASE_URL%og-cover.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
