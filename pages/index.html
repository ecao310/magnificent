<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moved to magnificent-fi.netlify.app</title>
  <!-- The site left GitHub Pages for Netlify on 12 September 2026, and this
       is what is served at the address it left, the one that was
       the Tax Torpedo.
       A link shared before then carries the reader's whole return in its
       query string, so the script carries it across; the refresh is the
       fallback for a reader with no script, and the canonical link is for
       a crawler. .github/workflows/deploy.yml publishes this tree, and
       `the front door` in src/guards/meta.test.ts holds each file in it
       to the README's Deployment section. -->
  <link rel="canonical" href="https://magnificent-fi.netlify.app/" />
  <meta http-equiv="refresh" content="0; url=https://magnificent-fi.netlify.app/" />
  <script>location.replace('https://magnificent-fi.netlify.app/' + location.search + location.hash);</script>
</head>

<body>
  <p>This page has moved to <a href="https://magnificent-fi.netlify.app/">https://magnificent-fi.netlify.app/</a>.</p>
</body>

</html>
