# How Netlify builds and serves the site. .github/workflows/deploy.yml is what
# is left of the GitHub Pages deploy the site had until September 2026: it
# publishes the forwarders in pages/. The README's Deployment section
# describes both.
#
# The site is two pages from one build: index.html at the domain's root and
# aca/index.html at /aca/. Both come out of the one `vite build` below, each
# at its own path under dist/, and Netlify serves a directory's index.html at
# the directory's address without being told, so nothing here names the second
# page. (Pretty URLs, on by default, send /aca to /aca/.)
#
# The build is vite.config.ts's own, at its `base` of `/`. What differs by
# deploy is the origin the link-preview card is addressed to, which the
# command hands the build as VITE_SITE_ORIGIN: production's is `URL`, the
# site's primary domain, custom domain included; a branch deploy's and a
# deploy preview's is `DEPLOY_PRIME_URL`, the deploy's own address, so a
# preview's card is its own rather than production's. (.env gives the
# variable the production origin for any build that does not set it.) It is
# expanded on the command line because Netlify does not expand a variable
# inside [context.*.environment].
#
# Tests run first, so a build that fails its tests does not publish.
#
# One header. Every file Vite emits under assets/ carries a content hash in
# its name, so it can be kept for a year and never revalidated — which is
# what makes the chunking in vite.config.ts worth having, since Netlify's
# default is to revalidate every file on every visit. Everything else keeps
# that default: the pages, so a deploy is seen at once, and the cards and
# icons under public/, whose names carry no hash. `the Netlify build` in
# src/guards/meta.test.ts reads this file and holds it to all of that, and
# `the build it emits` in src/guards/build.test.ts holds the build to putting
# every hashed file, and nothing else, under assets/.

[build]
  publish = "dist"
  command = 'npm run test && VITE_SITE_ORIGIN="$URL" npm run build'

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+. Pinned so that a change to the build
  # image's default cannot change the build.
  NODE_VERSION = "24"

[context.deploy-preview]
  command = 'npm run test && VITE_SITE_ORIGIN="$DEPLOY_PRIME_URL" npm run build'

[context.branch-deploy]
  command = 'npm run test && VITE_SITE_ORIGIN="$DEPLOY_PRIME_URL" npm run build'

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
